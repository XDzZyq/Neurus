name: bump-lib
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Advance lib to Neurus-Lib main
        run: git submodule update --init --remote --checkout lib
      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/bump-lib
          title: "chore: bump lib submodule"
          commit-message: "chore: bump lib submodule to Neurus-Lib main"
          body: "Bumps the `lib` submodule to the newest Neurus-Lib commit. CI gates the merge."
          add-paths: lib
          delete-branch: true
