name: CI

# Documentation-only changes never reach the compiler, and the matrix is four
# legs of Qt + Vulkan SDK. Two different mechanisms keep them cheap, and they
# are deliberately NOT symmetric:
#
#   * `push` filters at the trigger, so a documentation-only commit on master
#     creates no CI run at all. `docs_build.yml` publishes it instead.
#   * `pull_request` is intentionally UNFILTERED. A workflow skipped by a
#     trigger filter never reports a status, so once `ci-gate` is a required
#     check a docs-only PR would sit on "Expected — waiting for status"
#     forever. The skip therefore happens in a job condition instead, where
#     GitHub reports a skipped job as success.
#
# Branch protection must require `ci-gate` and nothing else. The matrix leg
# names (`build (windows-2022, Debug, x64)`) are not a format GitHub documents,
# and requiring them would mean editing the ruleset on every matrix change.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.graphifyignore'
      - '.github/requirements-docs.txt'
      - '.github/requirements-graph.txt'
      - '.github/workflows/docs_build.yml'
      - '**/*.md'
  pull_request:
    branches: [main, master]

jobs:
  # Decides whether this change touches anything the compiler cares about.
  # Mirrors the `paths-ignore` list above as negations; keep the two in sync.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `some-with-excludes` is required, not cosmetic: under the default `some`
      # quantifier a documentation file still matches the leading `**` and the
      # negations below are ignored, so `code` would always be true.
      - name: Detect non-documentation changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!mkdocs.yml'
              - '!.graphifyignore'
              - '!.github/requirements-docs.txt'
              - '!.github/requirements-graph.txt'
              - '!.github/workflows/docs_build.yml'
              - '!**/*.md'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
        configuration: [Debug, Release]
        platform: [x64]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Qt: both legs pin the version the prebuilt ADS archive in
      # lib/prebuilt is stamped with; any other Qt silently falls back to the
      # source build (asserted after configure below). ---
      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Setup Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # --- Common ---
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.341.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
          vulkan-use-cache: true

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Update dependencies and configure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          make update 2>&1 | tee "${{ runner.temp }}/configure.log"

      - name: Assert prebuilt ADS was used
        shell: bash
        run: |
          grep -q "Using pre-compiled qtadvanceddocking" "${{ runner.temp }}/configure.log" \
            || { echo "::error::prebuilt ADS not used — Qt drift between producer and consumer CI"; tail -50 "${{ runner.temp }}/configure.log"; exit 1; }

      # Blender-style i18n check: fail the build if any UI string in
      # res/i18n/*.po is untranslated (run before the build for a fast fail).
      # The extractor is tested first: a bug in it fails this job on every
      # matrix leg regardless of the source change, so its own suite has to be
      # the thing that reports the problem.
      - name: Test the translation extractor
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY scripts/test_extract_i18n.py

      - name: Check translations
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY scripts/extract_i18n.py --check

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Run Non-GPU Tests
        working-directory: build
        run: ctest -C ${{ matrix.configuration }} --output-on-failure

  # The single stable status check for branch protection. Reports success when
  # the matrix was skipped for a documentation-only pull request, and fails when
  # a leg actually broke. `always()` is load-bearing: without it a skipped
  # `build` would skip this job too, and the required check would never report.
  ci-gate:
    name: ci-gate
    needs: [changes, build]
    if: always()

    runs-on: ubuntu-latest

    steps:
      # Results arrive through `env` rather than inline `${{ }}` so nothing from
      # the event payload is ever interpolated into the shell.
      - name: Report matrix result
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "non-documentation changes: ${CODE_CHANGED:-<unset>}"
          echo "changes job:               $CHANGES_RESULT"
          echo "build matrix:              $BUILD_RESULT"

          # A broken gate must not read as a green build: `build` would be
          # `skipped` and this job would otherwise wave it through.
          case "$CHANGES_RESULT" in
            failure | cancelled)
              echo "::error::change detection reported $CHANGES_RESULT"
              exit 1
              ;;
          esac

          # `skipped` is the documentation-only path and is a pass. Only a real
          # failure or a cancellation fails the gate.
          case "$BUILD_RESULT" in
            failure | cancelled)
              echo "::error::C++ build matrix reported $BUILD_RESULT"
              exit 1
              ;;
          esac

          if [ "$BUILD_RESULT" = "skipped" ]; then
            echo "Documentation-only change — C++ matrix intentionally skipped."
          fi
